[project]
name = "backupmaster"
version = "4.0.0"
description = "Backup import files across entire disk"
authors = [{name = "Quinten Roets", email = "qdr2104@columbia.edu"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "package-utils[context] >=0.8.3, <1",
    "powercli >=0.4.5, <1",
    "superpathlib >=2.0.14, <3",
]

[project.optional-dependencies]
dev = [
    "dirhash >=0.2.1, <1",
    "package-dev-tools >=0.8.1, <1",
    "package-dev-utils >=0.1.6, <1",
]

[project.scripts]
backupmaster = "backup:entry_point"

[project.urls]
"Source Code" = "https://github.com/quintenroets/backup"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
# the argument-parser fast path (`defaults_cover_arguments`) is unreleased
package-utils = { path = "../package-utils", editable = true }
# the delayed progress bar (`track_progress` delay) is unreleased
powercli = { path = "../cli", editable = true }
# the yaml sidecar cache (`cached_yaml`) is unreleased
superpathlib = { path = "../superpathlib", editable = true }

[tool.coverage.run]
command_line = "-m pytest tests"
relative_files = true
# editable installs bring their source into scope
omit = ["*/cli/*", "*/package_utils/*", "*/superpathlib/*"]

[tool.coverage.report]
precision = 4
fail_under = 100

[tool.mypy]
strict = true
no_implicit_reexport = false

[tool.pytest.ini_options]
pythonpath = [
    "src", ".",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",   # annotated with Any
    "CPY001",   # missing copyright notice
    "D1",       # missing docstrings
    "D200",     # one-line docstring
    "D203",     # conflicts with D211
    "D205",     # blank line between summary and description
    "D212",     # conflicts with D213
    "D401",     # imperative first line
    "G004",     # logging f-string
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401"  # unused import
]
"src/backup/backup/change_tree.py" = [
    "PLC0415",  # powercli loads rich core anyway: this keeps tree and syntax out
]
"tests/*" = [
    "S101",    # assert used
    "PLR2004"  # Magic value used in comparison
]

[tool.setuptools.package-data]
backup = ["py.typed"]
